<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#090a10" />
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {}
        var d =
          t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        var h = document.documentElement;
        h.classList.toggle("dark", d);
        h.style.colorScheme = d ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = d ? "#090a10" : "#ffffff";
      })();
    </script>
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Hedge Fund Tracker — SEC Filing Tracker & Hedge Fund Analytics</title>
    <meta
      name="description"
      content="Track institutional investor activity through SEC filings. Surface high-conviction stock ideas from top hedge funds."
    />
    <meta property="og:title" content="Hedge Fund Tracker" />
    <meta property="og:description" content="SEC Filing Tracker & Hedge Fund Analytics" />
    <meta property="og:type" content="website" />
    <!-- GitHub Pages SPA redirect: restore path from query parameter -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
