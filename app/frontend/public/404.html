<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecting… — Hedge Fund Tracker</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // When GitHub Pages can't find a file, it serves this 404.html.
      // We redirect to index.html with the intended path encoded as a query parameter.
      var pathSegmentsToKeep = 1; // Keep "/hedge-fund-tracker" (repo name)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body>
    <noscript>
      <p>This page needs JavaScript. <a href="/hedge-fund-tracker/">Open Hedge Fund Tracker</a>.</p>
    </noscript>
  </body>
</html>
