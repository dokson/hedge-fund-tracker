services:
  app:
    build:
      context: .
      target: runtime
    image: hedge-fund-tracker:local
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Bind mount on purpose: the CSVs are the git-tracked dataset.
      - ./database:/app/database
      - ./__llmcache__:/app/__llmcache__
      - ./__reports__:/app/__reports__
      # Fail on a missing .env instead of creating a `.env/` directory.
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    environment:
      DOCKER_ENV: "1"
      # One JSON object per log line for container log collectors.
      LOG_FORMAT: json
      # Required secrets, no defaults. Generate with scripts/generate_secrets.py.
      DATABASE_URL: postgresql+asyncpg://hft:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/hft
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY required (see .env.example)}
      MASTER_KEY_VERSION: ${MASTER_KEY_VERSION:-1}
      RESET_PASSWORD_TOKEN_SECRET: ${RESET_PASSWORD_TOKEN_SECRET:?RESET_PASSWORD_TOKEN_SECRET required}
      VERIFICATION_TOKEN_SECRET: ${VERIFICATION_TOKEN_SECRET:?VERIFICATION_TOKEN_SECRET required}
      # Optional BYOK provider credentials (legacy env-var path; deprecated).
      FMP_API_KEY: ${FMP_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      OPENFIGI_API_KEY: ${OPENFIGI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

  db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: hft
      POSTGRES_DB: hft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required (use a strong random string)}
    volumes:
      # Postgres 18+ refuses a mount at the pre-18 /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    # Loopback only.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hft -d hft"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
